# Production stack for the Contabo VPS.
#
# The database is the managed CloudClusters PostgreSQL (external), so there is no
# database container here; the app connects out via DATABASE_URL in .env.
#
# TLS and the public domain are handled on the HOST by nginx + certbot (Let's
# Encrypt), which reverse proxies to this container. The API is therefore published
# only on the loopback interface (127.0.0.1:3000) so it is reachable by the host's
# nginx but never exposed directly to the public internet.
#
# The deploy pipeline sets API_IMAGE to the exact image tag before running
# `docker compose -f docker-compose.prod.yml up -d`.
services:
  api:
    image: ${API_IMAGE:-ghcr.io/anu-heritage-homecare/anuheritagehomecare-api:latest}
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
    ports:
      - '127.0.0.1:3000:3000'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 25s
